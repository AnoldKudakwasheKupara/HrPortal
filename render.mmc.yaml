services:
  - type: web
    name: hrportal-mmc
    runtime: docker
    region: frankfurt
    plan: 0.5c-512mb
    dockerfilePath: ./Dockerfile
    dockerContext: .
    autoDeployTrigger: commit
    disk:
      name: app-data
      mountPath: /app/App_Data
      sizeGB: 5
    envVars:
      - key: Brand__Key
        value: mmc
      - key: DATABASE_URL
        fromDatabase:
          name: hrportal-mmc-db
          property: connectionString
      - key: SeedAdministrator__Email
        sync: false
      - key: SeedAdministrator__Password
        sync: false

databases:
  - name: hrportal-mmc-db
    region: frankfurt
    plan: 0.1c-256mb
    databaseName: hrportal
    user: hrportal
    postgresMajorVersion: "18"
